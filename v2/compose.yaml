# Workend v2 — Docker Compose
#
# Run:   docker compose up --build
# Then:  open http://localhost:3000
#
# All non-engine containers run as non-root (uid 10001).
# The Dagger engine requires privileged mode (BuildKit limitation);
# it is the only privileged component and is reachable only via its
# socket on a private named volume.

name: workend

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: workend
      POSTGRES_PASSWORD: workend
      POSTGRES_DB: workend
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U workend -d workend"]
      interval: 5s
      timeout: 5s
      retries: 10
    expose:
      - "5432"

  dagger-engine:
    image: registry.dagger.io/engine:v0.13.7
    restart: unless-stopped
    privileged: true
    volumes:
      - dagger-engine-state:/var/lib/dagger
      - dagger-sock:/run/dagger
      - repos:/repos
    command:
      - "--addr"
      - "unix:///run/dagger/buildkitd.sock"
      - "--addr"
      - "tcp://0.0.0.0:1234"
    expose:
      - "1234"

  # One-shot: the api container runs as uid 10001 but the named volumes
  # /repos and /var/lib/workend/logs get root-owned the moment any other
  # container (dagger-engine) mounts them. This service runs as root, fixes
  # ownership, and exits before api starts.
  init-perms:
    image: alpine:3.20
    user: "0:0"
    volumes:
      - repos:/repos
      - logs:/var/lib/workend/logs
      - artifacts:/var/lib/workend/artifacts
    command: >-
      sh -c "chown -R 10001:101 /repos /var/lib/workend/logs /var/lib/workend/artifacts &&
             chmod 0775 /repos /var/lib/workend/logs /var/lib/workend/artifacts"
    restart: "no"

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      dagger-engine:
        condition: service_started
      init-perms:
        condition: service_completed_successfully
    environment:
      WORKEND_LISTEN_ADDR: ":8080"
      WORKEND_DATABASE_URL: "postgres://workend:workend@db:5432/workend?sslmode=disable"
      WORKEND_DAGGER_SOCK: "/run/dagger/buildkitd.sock"
      WORKEND_REPOS_ROOT: "/repos"
      WORKEND_LOGS_ROOT: "/var/lib/workend/logs"
      WORKEND_ARTIFACTS_ROOT: "/var/lib/workend/artifacts"
      # OAuth providers (all optional). For any provider configured, also
      # set WORKEND_TOKEN_KEY (32 bytes base64) for at-rest token encryption.
      #
      # Single-instance-per-provider via env vars (simplest path):
      WORKEND_GITHUB_CLIENT_ID: "${WORKEND_GITHUB_CLIENT_ID:-}"
      WORKEND_GITHUB_CLIENT_SECRET: "${WORKEND_GITHUB_CLIENT_SECRET:-}"
      WORKEND_GITLAB_CLIENT_ID: "${WORKEND_GITLAB_CLIENT_ID:-}"
      WORKEND_GITLAB_CLIENT_SECRET: "${WORKEND_GITLAB_CLIENT_SECRET:-}"
      WORKEND_GITLAB_URL: "${WORKEND_GITLAB_URL:-https://gitlab.com}"
      WORKEND_GITEA_CLIENT_ID: "${WORKEND_GITEA_CLIENT_ID:-}"
      WORKEND_GITEA_CLIENT_SECRET: "${WORKEND_GITEA_CLIENT_SECRET:-}"
      WORKEND_GITEA_URL: "${WORKEND_GITEA_URL:-}"
      # Multi-instance via JSON file (overrides env vars when set; mount the
      # file in via the volumes section below):
      WORKEND_PROVIDERS_FILE: "${WORKEND_PROVIDERS_FILE:-}"
      WORKEND_TOKEN_KEY: "${WORKEND_TOKEN_KEY:-}"
      # Stage 21: optional custom detectors. Path to a JSON file inside the
      # api container; mount it via the volumes section if you set this.
      WORKEND_DETECTORS_FILE: "${WORKEND_DETECTORS_FILE:-}"
      # Public URL the web frontend is reachable at (used for run links in
      # notifications). Defaults to localhost:3000 for local dev.
      WORKEND_WEB_PUBLIC_URL: "${WORKEND_WEB_PUBLIC_URL:-http://localhost:8080}"
      # SMTP for email notifications (optional).
      WORKEND_SMTP_HOST: "${WORKEND_SMTP_HOST:-}"
      WORKEND_SMTP_FROM: "${WORKEND_SMTP_FROM:-}"
      WORKEND_SMTP_USERNAME: "${WORKEND_SMTP_USERNAME:-}"
      WORKEND_SMTP_PASSWORD: "${WORKEND_SMTP_PASSWORD:-}"
      # OIDC / Keycloak (optional). Set all three to enable SSO.
      WORKEND_OIDC_ISSUER: "${WORKEND_OIDC_ISSUER:-}"
      WORKEND_OIDC_CLIENT_ID: "${WORKEND_OIDC_CLIENT_ID:-}"
      WORKEND_OIDC_CLIENT_SECRET: "${WORKEND_OIDC_CLIENT_SECRET:-}"
      WORKEND_OIDC_PROVIDER_NAME: "${WORKEND_OIDC_PROVIDER_NAME:-SSO}"
      _EXPERIMENTAL_DAGGER_RUNNER_HOST: "tcp://dagger-engine:1234"
    volumes:
      - dagger-sock:/run/dagger:ro
      - repos:/repos
      - logs:/var/lib/workend/logs
      - artifacts:/var/lib/workend/artifacts
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    expose:
      - "8080"

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - api
    environment:
      WORKEND_API_URL: "http://api:8080"
      NODE_ENV: production
      # SvelteKit (adapter-node) rejects form POSTs with a non-matching Origin
      # as cross-site. Tell it what its public origin actually is. Override
      # via WORKEND_WEB_PUBLIC_URL when reverse-proxying or hosting elsewhere.
      ORIGIN: "${WORKEND_WEB_PUBLIC_URL:-http://localhost:8080}"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    expose:
      - "3000"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - api
      - web
    ports:
      - "8080:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

  dockscope:
    image: ghcr.io/manuelr-t/dockscope
    platform: linux/amd64
    restart: unless-stopped
    environment:
      - HOST=0.0.0.0
    entrypoint: >
      sh -c "sed -i 's/127.0.0.1/0.0.0.0/g' /app/dist/server/index.js && node dist/cli.js up --no-open"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "4681:4681"

  otel-gui:
    image: ghcr.io/metafab/otel-gui:latest
    restart: unless-stopped
    ports:
      - "4318:4318"

volumes:
  db-data:
  dagger-engine-state:
  dagger-sock:
  repos:
  logs:
  artifacts:
  caddy-data:
  caddy-config:
