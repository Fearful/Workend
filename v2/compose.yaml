# Workend v2 — Docker Compose
#
# Run:   docker compose up --build
# Then:  open http://localhost:3000
#
# All non-engine containers run as non-root (uid 10001).
# The Dagger engine requires privileged mode (BuildKit limitation);
# it is the only privileged component and is reachable only via its
# socket on a private named volume.

name: workend

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: workend
      POSTGRES_PASSWORD: workend
      POSTGRES_DB: workend
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U workend -d workend"]
      interval: 5s
      timeout: 5s
      retries: 10
    expose:
      - "5432"

  dagger-engine:
    image: registry.dagger.io/engine:v0.13.7
    restart: unless-stopped
    privileged: true
    volumes:
      - dagger-engine-state:/var/lib/dagger
      - dagger-sock:/run/dagger
      - repos:/repos
    command:
      - "--addr"
      - "unix:///run/dagger/buildkitd.sock"
      - "--addr"
      - "tcp://0.0.0.0:1234"
    expose:
      - "1234"

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      dagger-engine:
        condition: service_started
    environment:
      WORKEND_LISTEN_ADDR: ":8080"
      WORKEND_DATABASE_URL: "postgres://workend:workend@db:5432/workend?sslmode=disable"
      WORKEND_DAGGER_SOCK: "/run/dagger/buildkitd.sock"
      WORKEND_REPOS_ROOT: "/repos"
      WORKEND_LOGS_ROOT: "/var/lib/workend/logs"
      # OAuth providers (all optional). For any provider configured, also
      # set WORKEND_TOKEN_KEY (32 bytes base64) for at-rest token encryption.
      #
      # Single-instance-per-provider via env vars (simplest path):
      WORKEND_GITHUB_CLIENT_ID:     "${WORKEND_GITHUB_CLIENT_ID:-}"
      WORKEND_GITHUB_CLIENT_SECRET: "${WORKEND_GITHUB_CLIENT_SECRET:-}"
      WORKEND_GITLAB_CLIENT_ID:     "${WORKEND_GITLAB_CLIENT_ID:-}"
      WORKEND_GITLAB_CLIENT_SECRET: "${WORKEND_GITLAB_CLIENT_SECRET:-}"
      WORKEND_GITLAB_URL:           "${WORKEND_GITLAB_URL:-https://gitlab.com}"
      WORKEND_GITEA_CLIENT_ID:      "${WORKEND_GITEA_CLIENT_ID:-}"
      WORKEND_GITEA_CLIENT_SECRET:  "${WORKEND_GITEA_CLIENT_SECRET:-}"
      WORKEND_GITEA_URL:            "${WORKEND_GITEA_URL:-}"
      # Multi-instance via JSON file (overrides env vars when set; mount the
      # file in via the volumes section below):
      WORKEND_PROVIDERS_FILE:       "${WORKEND_PROVIDERS_FILE:-}"
      WORKEND_TOKEN_KEY:            "${WORKEND_TOKEN_KEY:-}"
      # Public URL the web frontend is reachable at (used for run links in
      # notifications). Defaults to localhost:3000 for local dev.
      WORKEND_WEB_PUBLIC_URL: "${WORKEND_WEB_PUBLIC_URL:-http://localhost:3000}"
      # SMTP for email notifications (optional).
      WORKEND_SMTP_HOST: "${WORKEND_SMTP_HOST:-}"
      WORKEND_SMTP_FROM: "${WORKEND_SMTP_FROM:-}"
      WORKEND_SMTP_USERNAME: "${WORKEND_SMTP_USERNAME:-}"
      WORKEND_SMTP_PASSWORD: "${WORKEND_SMTP_PASSWORD:-}"
      _EXPERIMENTAL_DAGGER_RUNNER_HOST: "tcp://dagger-engine:1234"
    volumes:
      - dagger-sock:/run/dagger:ro
      - repos:/repos
      - logs:/var/lib/workend/logs
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    expose:
      - "8080"

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - api
    environment:
      WORKEND_API_URL: "http://api:8080"
      NODE_ENV: production
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    ports:
      - "3000:3000"

volumes:
  db-data:
  dagger-engine-state:
  dagger-sock:
  repos:
  logs:
