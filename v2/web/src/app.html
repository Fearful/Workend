<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Workend — developer workstation" />
    <title>Workend</title>
    <script>
      // Pick the theme before first paint to avoid a flash. Order of
      // precedence: explicit user choice (localStorage) > system preference.
      (function () {
        try {
          var stored = localStorage.getItem('workend_theme');
          var theme = stored;
          if (!theme) {
            theme = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches
              ? 'light'
              : 'dark';
          }
          document.documentElement.setAttribute('data-theme', theme);
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      })();
    </script>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
